    <script src="../JS/app.js?v=639250641835541270" defer=""></script>
    <!-- Catálogos ASEA: sudi_asea_petroliferos, sudi_asea_documentos, sudi_asea_checklist (SQL 0011) -->
    <script defer="">
        document.addEventListener('DOMContentLoaded', () => {
            'use strict';
            const $ = (id) => document.getElementById(id);
            const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const norm = (t) => String(t ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
            const toast = (m, t = 'success') => App.toast(m, t);

            const TABS = {
                petroliferos: { titulo: 'Petrolíferos', tabla: 'sudi_asea_petroliferos', icono: 'ph-drop', color: 'text-amber-400' },
                documentos:   { titulo: 'Documentos',   tabla: 'sudi_asea_documentos',   icono: 'ph-file-text', color: 'text-sky-400' },
                checklist:    { titulo: 'Check list operación', tabla: 'sudi_asea_checklist', icono: 'ph-list-checks', color: 'text-emerald-400' },
            };
            let DB = null;
            let editor = false;
            let tab = TABS[location.hash.slice(1)] ? location.hash.slice(1) : 'petroliferos';
            const datos = { petroliferos: [], documentos: [], checklist: [] };
            let editando = null;

            const textoDe = (r) => (tab === 'checklist' ? r.pregunta : r.nombre);

            function pintarTabs() {
                $('tabs').innerHTML = Object.entries(TABS).map(([k, t]) => {
                    const on = k === tab;
                    return `<button data-tab="${k}" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold border transition-all ${on ? 'bg-brand-yellow/10 border-brand-yellow text-brand-yellow shadow-[0_0_15px_rgba(234,179,8,0.15)]' : 'bg-dark-800 border-dark-700 text-gray-300 hover:border-dark-600 hover:text-white'}">
                        <i class="ph ${t.icono} text-lg ${on ? '' : t.color}"></i> ${t.titulo}
                        <span class="text-[11px] px-2 py-0.5 rounded-md ${on ? 'bg-brand-yellow text-dark-900' : 'bg-dark-900 text-gray-400'}">${datos[k].length}</span>
                    </button>`;
                }).join('');
                const esCheck = tab === 'checklist';
                $('alta-seccion').classList.toggle('hidden', !esCheck);
                $('alta-nombre').placeholder = esCheck ? 'Pregunta o punto a revisar (Enter para agregar)' : `Nuevo ${tab === 'documentos' ? 'documento' : 'petrolífero'} (Enter para agregar)`;
            }

            function acciones(r) {
                if (!editor) return '';
                return `<div class="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                    <button data-acc="editar" title="Editar" class="p-1.5 rounded-md text-gray-400 hover:text-brand-yellow hover:bg-dark-700"><i class="ph ph-pencil-simple"></i></button>
                    <button data-acc="activo" title="${r.activo ? 'Desactivar' : 'Activar'}" class="p-1.5 rounded-md text-gray-400 hover:text-white hover:bg-dark-700"><i class="ph ${r.activo ? 'ph-eye' : 'ph-eye-slash'}"></i></button>
                    <button data-acc="borrar" title="Eliminar" class="p-1.5 rounded-md text-gray-400 hover:text-red-400 hover:bg-dark-700"><i class="ph ph-trash"></i></button>
                </div>`;
            }

            function chip(r, i, extra = '') {
                const t = TABS[tab];
                const cuerpo = editando === r.id
                    ? `<input class="chip-input" data-edit value="${esc(textoDe(r))}">`
                    : `<span class="text-sm ${r.activo ? 'text-gray-200' : 'text-gray-500 line-through'} leading-snug">${extra}${esc(textoDe(r))}</span>`;
                return `<div data-id="${r.id}" class="chip group flex items-center gap-3 bg-dark-800 border border-dark-700 hover:border-brand-yellow/40 rounded-xl px-3 py-2.5 transition-colors" style="animation-delay:${Math.min(i * 0.02, 0.4)}s">
                    <i class="ph ${t.icono} ${t.color} text-lg shrink-0 ${r.activo ? '' : 'opacity-40'}"></i>
                    <div class="flex-1 min-w-0">${cuerpo}</div>${editando === r.id ? '' : acciones(r)}
                </div>`;
            }

            function pintar() {
                pintarTabs();
                const term = norm($('buscar').value);
                const lista = datos[tab].filter((r) => !term || norm(`${textoDe(r)} ${r.seccion || ''}`).includes(term));
                $('resumen').textContent = `${lista.length} de ${datos[tab].length} registro(s)${editor ? ' · Pasa el cursor sobre un elemento para editarlo' : ''}`;
                if (!lista.length) {
                    $('contenido').innerHTML = `<div class="text-center py-16 text-gray-500 text-sm"><i class="ph ${TABS[tab].icono} text-4xl block mb-2 opacity-40"></i>${datos[tab].length ? 'Sin coincidencias.' : 'Aún no hay registros. Agrega el primero arriba.'}</div>`;
                    return;
                }
                if (tab !== 'checklist') {
                    $('contenido').innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-2">${lista.map((r, i) => chip(r, i)).join('')}</div>`;
                } else {
                    const grupos = {};
                    lista.forEach((r) => { (grupos[r.seccion || 'General'] ||= []).push(r); });
                    let i = 0;
                    $('contenido').innerHTML = Object.entries(grupos).map(([sec, items]) => `
                        <section class="mb-6 fade-in">
                            <h3 class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-2 flex items-center gap-2"><span class="w-1.5 h-4 rounded bg-brand-yellow"></span>${esc(sec)} <span class="text-gray-600">${items.length}</span></h3>
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-2">${items.map((r, k) => chip(r, i++, `<b class="text-gray-500 mr-1.5">${k + 1}.</b>`)).join('')}</div>
                        </section>`).join('');
                }
                const inp = document.querySelector('[data-edit]');
                if (inp) { inp.focus(); inp.select(); }
                $('lst-secciones').innerHTML = [...new Set(datos.checklist.map((r) => r.seccion))].map((s) => `<option value="${esc(s)}">`).join('');
            }

            async function cargar(k = tab) {
                const orden = k === 'checklist' ? 'orden' : 'nombre';
                datos[k] = await DB.listar(TABS[k].tabla, { orden }).catch((err) => { toast(err.message, 'error'); return []; });
                if (k === 'checklist') datos[k].sort((a, b) => String(a.seccion).localeCompare(String(b.seccion), 'es') || a.orden - b.orden);
                else datos[k].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
            }

            function duplicado(texto, excepto = null) {
                const n = norm(texto);
                return datos[tab].some((r) => r.id !== excepto && norm(textoDe(r)) === n);
            }

            async function agregar() {
                const texto = $('alta-nombre').value.trim().replace(/\s+/g, ' ');
                if (!texto) { $('alta-nombre').focus(); return; }
                if (duplicado(texto)) { toast('Ya existe en el catálogo.', 'warning'); return; }
                const fila = tab === 'checklist'
                    ? { seccion: $('alta-seccion').value.trim() || 'General', pregunta: texto, orden: datos.checklist.length + 1 }
                    : { nombre: texto };
                try {
                    await DB.crear(TABS[tab].tabla, fila);
                    $('alta-nombre').value = '';
                    await cargar();
                    pintar();
                    toast('Agregado.');
                } catch (err) { toast(/duplicate|repetido/i.test(err.message) ? 'Ya existe en el catálogo.' : err.message, 'error'); }
            }

            async function guardarEdicion(id, texto) {
                editando = null;
                texto = texto.trim().replace(/\s+/g, ' ');
                const r = datos[tab].find((x) => x.id === id);
                if (!r || !texto || texto === textoDe(r)) { pintar(); return; }
                if (duplicado(texto, id)) { toast('Ya existe en el catálogo.', 'warning'); pintar(); return; }
                try {
                    await DB.actualizar(TABS[tab].tabla, id, tab === 'checklist' ? { pregunta: texto } : { nombre: texto });
                    await cargar();
                    toast('Actualizado.');
                } catch (err) { toast(err.message, 'error'); }
                pintar();
            }

            $('tabs').addEventListener('click', (e) => {
                const b = e.target.closest('[data-tab]');
                if (!b || b.dataset.tab === tab) return;
                tab = b.dataset.tab;
                editando = null;
                history.replaceState(null, '', `#${tab}`);
                $('buscar').value = '';
                pintar();
            });
            $('buscar').addEventListener('input', pintar);
            $('alta-btn').addEventListener('click', agregar);
            $('alta-nombre').addEventListener('keydown', (e) => { if (e.key === 'Enter') agregar(); });

            $('contenido').addEventListener('click', (e) => {
                const b = e.target.closest('[data-acc]');
                if (!b) return;
                const id = b.closest('[data-id]').dataset.id;
                const r = datos[tab].find((x) => x.id === id);
                if (b.dataset.acc === 'editar') { editando = id; pintar(); }
                else if (b.dataset.acc === 'activo') {
                    DB.actualizar(TABS[tab].tabla, id, { activo: !r.activo }).then(() => cargar()).then(pintar).catch((err) => toast(err.message, 'error'));
                } else if (b.dataset.acc === 'borrar') {
                    App.confirmAction({
                        title: '¿Eliminar del catálogo?', message: textoDe(r), confirmLabel: 'Eliminar',
                        onConfirm: async () => {
                            try { await DB.eliminar(TABS[tab].tabla, id); await cargar(); pintar(); toast('Eliminado.'); } catch (err) { toast(err.message, 'error'); }
                        },
                    });
                }
            });
            $('contenido').addEventListener('keydown', (e) => {
                const inp = e.target.closest('[data-edit]');
                if (!inp) return;
                if (e.key === 'Enter') guardarEdicion(inp.closest('[data-id]').dataset.id, inp.value);
                if (e.key === 'Escape') { editando = null; pintar(); }
            });
            $('contenido').addEventListener('focusout', (e) => {
                const inp = e.target.closest('[data-edit]');
                if (inp && editando) guardarEdicion(inp.closest('[data-id]').dataset.id, inp.value);
            });

            (async () => {
                try { DB = await App.db(); } catch (err) {
                    $('contenido').innerHTML = `<p class="text-center text-red-400 text-sm py-10">${esc(err.message)}</p>`;
                    return;
                }
                editor = DB.puedeEditar();
                if (!editor) document.querySelectorAll('[data-editor]').forEach((el) => el.classList.add('hidden'));
                $('contenido').innerHTML = '<p class="text-center text-gray-500 text-sm py-10"><i class="ph ph-spinner animate-spin"></i> Cargando...</p>';
                await Promise.all(Object.keys(TABS).map((k) => cargar(k)));
                pintar();
            })();
        });
    </script>
